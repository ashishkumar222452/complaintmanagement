# render.yaml — Render.com Blueprint for Online Complaint Management System
# This file configures both backend (Web Service) and frontend (Static Site)
# See: https://render.com/docs/blueprint-spec

services:
  # ─────────────────────────────────────────
  # BACKEND: Express.js Web Service (Docker)
  # ─────────────────────────────────────────
  - type: web
    name: ocms-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false          # Set manually in Render dashboard (optional — uses file fallback if not set)

  # ─────────────────────────────────────────
  # FRONTEND: React + Vite Static Site
  # ─────────────────────────────────────────
  - type: web
    name: ocms-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your Render backend URL e.g. https://ocms-backend.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
